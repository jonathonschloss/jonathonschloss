<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Notice, build, document, teach, repeat."><title>Notice, build, document, teach, repeat.</title><defs></defs><style>@font-face{font-family:'js-mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'js-monob';src:url(data:font/woff2;base64,) format('woff2');}.disp{font-family:'js-disp','Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif}.body{font-family:'js-body','Geist',-apple-system,'Segoe UI',system-ui,sans-serif}.bodyb{font-family:'js-bodyb','Geist',-apple-system,'Segoe UI',system-ui,sans-serif}.mono{font-family:'js-mono','Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.monob{font-family:'js-monob','Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.w{opacity:.35;animation:wl 6s ease-in-out infinite}.w0{animation-delay:0.0s}.w1{animation-delay:1.2s}.w2{animation-delay:2.4s}.w3{animation-delay:3.5999999999999996s}.w4{animation-delay:4.8s}@keyframes wl{0%,30%,100%{opacity:.35}8%,20%{opacity:1}}.ar{opacity:.4}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rv{opacity:1!important}}</style><text x="60" y="52" font-size="22" fill="#8e9bb3" text-anchor="middle" class="monob w w0">notice</text><text x="145.0" y="52" font-size="20" fill="#8e9bb3" text-anchor="middle" class="mono ar">→</text><text x="230" y="52" font-size="22" fill="#3dd6c3" text-anchor="middle" class="monob w w1">build</text><text x="315.0" y="52" font-size="20" fill="#8e9bb3" text-anchor="middle" class="mono ar">→</text><text x="400" y="52" font-size="22" fill="#d9b46f" text-anchor="middle" class="monob w w2">document</text><text x="500.0" y="52" font-size="20" fill="#8e9bb3" text-anchor="middle" class="mono ar">→</text><text x="600" y="52" font-size="22" fill="#e8935a" text-anchor="middle" class="monob w w3">teach</text><text x="690.0" y="52" font-size="20" fill="#8e9bb3" text-anchor="middle" class="mono ar">→</tex